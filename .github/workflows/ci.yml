name: CI

on:
  workflow_dispatch:
  pull_request:
    paths-ignore:
      - "**.md"
      - LICENSE
  push:
    paths-ignore:
      - "**.md"
      - LICENSE

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Run ShellCheck
        uses: ludeeus/action-shellcheck@2.0.0
        with:
          scandir: "./bin"
          additional_args: --external-sources

  ubuntu:
    strategy:
      fail-fast: false
      matrix:
        include:
          - container: alpine:latest
            preinstall: apk add bash coreutils curl git
          - container: rockylinux:latest
            preinstall: dnf -y install git
          - container: ubuntu:latest
            preinstall: apt-get -y update && apt-get -y install curl git

    runs-on: ubuntu-latest

    container:
      image: ${{ matrix.container }}

    steps:
      - name: Preinstall
        run: ${{ matrix.preinstall }}

      - name: Test plugin
        uses: asdf-vm/actions/plugin-test@v2
        with:
          command: kwokctl version

  macos:
    runs-on: macos-latest

    steps:
      - name: Test plugin
        uses: asdf-vm/actions/plugin-test@v2
        with:
          command: kwokctl version
